[package]
name = "osage"
version = "0.1.0-alpha.0"
edition = "2024"
rust-version = "1.85"
description = "A terminal SQL IDE: catalog browser, SQL editor and results grid over ADBC"
license = "MIT"
readme = "README.md"
repository = "https://github.com/benzimmer/osage"
homepage = "https://github.com/benzimmer/osage"
keywords = ["sql", "tui", "database", "adbc", "arrow"]
categories = ["command-line-utilities", "database"]
exclude = ["specs/", "target/"]

[dependencies]
adbc_core = "0.23"
adbc_driver_manager = "0.23"
arrow = { version = "58", features = ["ipc", "csv", "json", "prettyprint"] }
color-eyre = "0.6.5"
crossterm = "0.28"
csv = "1.4.0"
dirs = "6.0.0"
keyring = { version = "4.1.6", features = ["apple-native-keyring-store"] }
nucleo-matcher = "0.3.1"
ratatui = { version = "0.29", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
toml = "1.1.4"
tree-sitter = "0.26.12"
tree-sitter-sequel = "0.3"
tui-textarea = { version = "0.7", features = ["crossterm", "search"] }
